<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إنشاء الغرف وموافقة الإدمن</title>
    <!-- تضمين مكتبة فايربيس (الإصدار القديم المتوافق مع Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        .container { background: #fff; max-width: 600px; margin: 0 auto; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 10px 0; font-size: 16px; width: 80%; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background: #218838; }
        .room-card { background: #e9ecef; padding: 10px; margin: 10px 0; border-radius: 5px; text-align: right; display: flex; justify-content: space-between; align-items: center; }
        .admin-section { margin-top: 40px; border-top: 2px dashed #ccc; padding-top: 20px; }
        .approve-btn { background: #007bff; width: auto; padding: 5px 15px; margin: 0; }
        .approve-btn:hover { background: #0056b3; }
        .status-pending { color: orange; font-weight: bold; }
        .status-approved { color: green; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>إنشاء غرفتي الخاصة</h2>
    <div id="user-section">
        <input type="text" id="roomNameInput" placeholder="أدخل اسم الغرفة...">
        <br>
        <button id="createRoomBtn">إنشاء الغرفة</button>
        <p id="userMessage"></p>
    </div>

    <div id="myRoomStatus" style="margin-top: 20px;"></div>

    <!-- قسم لوحة تحكم الأدمن -->
    <div class="admin-section">
        <h3>لوحة تحكم الأدمن (طلبات الغرف المعلقة)</h3>
        <div id="adminRoomsList">جاري التحميل...</div>
    </div>
</div>

<script>
    // إعدادات فايربيس الخاصة بك (استبدلها بالمعلومات الخاصة بمشروعك)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // تهيئة فايربيس
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    } else {
        firebase.app();
    }

    const db = firebase.database();

    // توليد معرف فريد للمستخدم وحفظه في المتصفح لضمان عدم إنشاء أكثر من غرفة لنفس الجهاز
    let userId = localStorage.getItem('app_user_id');
    if (!userId) {
        userId = 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('app_user_id', userId);
    }

    const roomNameInput = document.getElementById('roomNameInput');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const userMessage = document.getElementById('userMessage');
    const myRoomStatus = document.getElementById('myRoomStatus');
    const adminRoomsList = document.getElementById('adminRoomsList');

    // 1. التحقق من حالة غرفة المستخدم الحالي عند فتح الصفحة
    function checkUserRoom() {
        db.ref('customRooms').orderByChild('userId').equalTo(userId).once('value', (snapshot) => {
            if (snapshot.exists()) {
                let roomData;
                let roomId;
                snapshot.forEach((child) => {
                    roomId = child.key;
                    roomData = child.val();
                });

                createRoomBtn.style.display = 'none';
                roomNameInput.style.display = 'none';

                if (roomData.status === 'pending') {
                    myRoomStatus.innerHTML = `لديك غرفة مسجلة باسم: <b>${roomData.roomName}</b> <br>الحالة: <span class="status-pending">قيد انتظار موافقة الأدمن ⏳</span>`;
                } else if (roomData.status === 'approved') {
                    myRoomStatus.innerHTML = `غرفتك <b>${roomData.roomName}</b> <span class="status-approved">مفعلة وجاهزة للاستخدام ✅</span>`;
                }
            }
        });
    }

    checkUserRoom();

    // 2. زر إنشاء الغرفة
    createRoomBtn.addEventListener('click', () => {
        const roomName = roomNameInput.value.trim();
        if (!roomName) {
            alert('الرجاء كتابة اسم الغرفة');
            return;
        }

        // التأكد مرة أخرى قبل الإرسال لمنع التلاعب
        db.ref('customRooms').orderByChild('userId').equalTo(userId).once('value', (snapshot) => {
            if (snapshot.exists()) {
                alert('عذراً، لديك غرفة مسبقاً بالفعل ولا يمكنك إنشاء غرف أخرى.');
                location.reload();
                return;
            }

            const newRoomRef = db.ref('customRooms').push();
            const roomId = newRoomRef.key;

            const roomData = {
                roomId: roomId,
                userId: userId,
                roomName: roomName,
                status: 'pending', // معلقة بانتظار الأدمن
                createdAt: Date.now()
            };

            newRoomRef.set(roomData).then(() => {
                alert('تم إرسال طلب إنشاء الغرفة بنجاح! بانتظار موافقة الأدمن.');
                location.reload();
            }).catch((error) => {
                alert('حدث خطأ: ' + error.message);
            });
        });
    });

    // 3. جلب الغرف المعلقة للأدمن
    db.ref('customRooms').on('value', (snapshot) => {
        adminRoomsList.innerHTML = '';
        let hasPending = false;

        snapshot.forEach((childSnapshot) => {
            const room = childSnapshot.val();
            if (room.status === 'pending') {
                hasPending = true;
                const roomDiv = document.createElement('div');
                roomDiv.className = 'room-card';
                roomDiv.innerHTML = `
                    <div>
                        <b>اسم الغرفة:</b> ${room.roomName} <br>
                        <small style="color: #666;">معرف المستخدم: ${room.userId}</small>
                    </div>
                    <button class="approve-btn" onclick="approveRoom('${room.roomId}')">موافقة وتفعيل</button>
                `;
                adminRoomsList.appendChild(roomDiv);
            }
        });

        if (!hasPending) {
            adminRoomsList.innerHTML = '<p style="color: #777;">لا توجد طلبات معلقة حالياً.</p>';
        }
    });

    // 4. دالة موافقة الأدمن
    window.approveRoom = function(roomId) {
        db.ref('customRooms/' + roomId).update({
            status: 'approved'
        }).then(() => {
            alert('تمت الموافقة على الغرفة وتفعيلها بنجاح!');
        }).catch((error) => {
            alert('خطأ أثناء التحديث: ' + error.message);
        });
    };
</script>

</body>
</html>
